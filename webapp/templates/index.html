{% extends 'base.html' %}

{% block content %}
    <h1>Todos</h1>

    <div class="row row-cols-3">

        {% for todo in todos %}
            <div class="col mb-4">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">{{ todo.'summary' }}</h4>
                        <div>
                            <a href="{% url 'todo_view' todo.pk %}" class="btn-solid theme-primary">Подробнее</a>
                            <a role="button"
                               href="{% url 'todo_delete' todo.pk %}"
                               class="btn-solid theme-danger">Удалить</a>
                        </div>
                    </div>
                </div>

            </div>
        {% endfor %}
    </div>

{% endblock %}
